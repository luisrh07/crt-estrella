
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Para Estrella</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="envelope" onclick="openEnvelope()">
      <div class="flap"></div>
      <div class="letter">
        <h1>Te quiero mucho, Estrella</h1>
        <p>
          Desde que te conocí, cada momento se volvió más bonito. Gracias por ser tan especial.  
        </p>
        <p>
          Hoy quería regalarte un pedacito de mí en forma de esta carta virtual.  
          ¡Ojalá te saque una sonrisa!
        </p>
        <p class="firma">Con cariño, tu chico</p>
      </div>
    </div>
    <div class="animation">
      <div class="hearts"></div>
      <div class="sunflowers"></div>
    </div>
  </div>
  <audio id="bg-music" src="volver-a-amar.mp3" autoplay loop></audio>
  <script src="script.js"></script>
</body>
</html>
